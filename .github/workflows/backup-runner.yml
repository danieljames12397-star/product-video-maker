name: Backup post runner
# Posts due Post Queue records ONLY while the Make organization is paused.
on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = only show what would be posted"
        default: "1"
      force:
        description: "1 = run even if Make is active (testing)"
        default: "0"
      check_keys:
        description: "1 = test the Zernio and Buffer keys"
        default: "0"
concurrency:
  group: backup-runner
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run backup
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          FORCE: ${{ github.event.inputs.force || '0' }}
          CHECK_KEYS: ${{ github.event.inputs.check_keys || '0' }}
        run: python scripts/backup_runner.py
